<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار هندسة الأساسات التفاعلي - 100 سؤال</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
  
  :root {
    --primary: #1a5f7a;
    --primary-dark: #0d3b4d;
    --accent: #159895;
    --success: #2ecc71;
    --danger: #e74c3c;
    --warning: #f39c12;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Tajawal', sans-serif;
    background: linear-gradient(135deg, #0d3b4d 0%, #1a5f7a 40%, #159895 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 20px;
  }
  
  .container {
    max-width: 820px;
    margin: 0 auto;
  }
  
  .start-screen, .result-screen {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: fadeIn 0.5s ease;
  }
  
  .start-screen h1 {
    font-size: 2.2rem;
    color: var(--primary-dark);
    margin-bottom: 12px;
  }
  
  .start-screen p {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 28px;
    line-height: 1.7;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    box-shadow: 0 8px 20px rgba(21, 152, 149, 0.35);
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(21, 152, 149, 0.45);
  }
  
  .btn-secondary {
    background: #e2e8f0;
    color: var(--text);
  }
  
  .btn-secondary:hover { background: #cbd5e1; }
  
  .btn-outline {
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
  }
  
  .btn-outline:hover {
    background: var(--primary);
    color: white;
  }
  
  .btn-download {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
  }
  
  .btn-download:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(124, 58, 237, 0.4);
  }
  
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }
  
  .start-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 10px;
  }
  
  .progress-bar-container {
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    height: 12px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    border-radius: 50px;
    transition: width 0.4s ease;
    width: 0%;
  }
  
  .quiz-card {
    background: var(--card);
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: fadeIn 0.4s ease;
  }
  
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .question-counter {
    background: var(--primary);
    color: white;
    padding: 8px 18px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.95rem;
  }
  
  .score-live {
    background: #fef3c7;
    color: #92400e;
    padding: 8px 18px;
    border-radius: 50px;
    font-weight: 700;
  }
  
  .lang-toggle {
    background: #e0f2fe;
    color: #0369a1;
    border: none;
    padding: 8px 16px;
    border-radius: 50px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  
  .lang-toggle:hover { background: #bae6fd; }
  
  .question-text {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.8;
    margin-bottom: 28px;
    color: var(--primary-dark);
  }
  
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }
  
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #f8fafc;
  }
  
  .option:hover {
    border-color: var(--accent);
    background: #f0fdfa;
  }
  
  .option.selected {
    border-color: var(--primary);
    background: #e0f2fe;
    box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.15);
  }
  
  .option-letter {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  
  .option.selected .option-letter { background: var(--accent); }
  
  .option-text { flex: 1; font-size: 1.05rem; line-height: 1.5; }
  
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .nav-buttons .btn { flex: 1; min-width: 120px; }
  
  .result-icon {
    font-size: 4rem;
    margin-bottom: 16px;
  }
  
  .result-score {
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--primary);
    margin: 8px 0;
  }
  
  .result-grade {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  
  .result-message {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 28px;
    line-height: 1.7;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  
  .stat-box {
    background: #f1f5f9;
    border-radius: 16px;
    padding: 16px;
  }
  
  .stat-box .num {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--primary);
  }
  
  .stat-box .label {
    font-size: 0.9rem;
    color: var(--muted);
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .hidden { display: none !important; }
  
  @media (max-width: 600px) {
    .start-screen, .quiz-card, .result-screen { padding: 28px 20px; }
    .question-text { font-size: 1.1rem; }
    .stats-grid { grid-template-columns: 1fr; }
    .start-buttons { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- شاشة البداية -->
  <div id="startScreen" class="start-screen">
    <h1>🏗️ اختبار هندسة الأساسات</h1>
    <p>
      100 سؤال اختيار من متعدد في مادة Foundation Engineering<br>
      يمكنك التنقل بين الأسئلة، وتفعيل الترجمة، ومعرفة درجتك في النهاية
    </p>
    <div class="start-buttons">
      <button class="btn btn-primary" onclick="startQuiz()">🚀 ابدأ الاختبار</button>
      <button class="btn btn-download" onclick="downloadCode()">⬇️ تحميل الكود (HTML)</button>
    </div>
  </div>

  <!-- شاشة الاختبار -->
  <div id="quizScreen" class="hidden">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="quiz-card">
      <div class="quiz-header">
        <span class="question-counter" id="counter">السؤال 1 من 100</span>
        <span class="score-live" id="liveScore">الإجابات: 0</span>
        <button class="lang-toggle" id="langBtn" onclick="toggleLang()">🌐 عربي</button>
      </div>
      
      <div class="question-text" id="questionText"></div>
      
      <div class="options-list" id="optionsList"></div>
      
      <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← السابق</button>
        <button class="btn btn-outline" id="skipBtn" onclick="nextQuestion()">تخطي</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">التالي →</button>
      </div>
    </div>
  </div>

  <!-- شاشة النتيجة -->
  <div id="resultScreen" class="result-screen hidden">
    <div class="result-icon" id="resultIcon">🏆</div>
    <h2>نتيجة الاختبار</h2>
    <div class="result-score" id="finalScore">0</div>
    <div class="result-grade" id="finalGrade">ممتاز</div>
    <p class="result-message" id="finalMessage"></p>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="num" id="correctCount">0</div>
        <div class="label">إجابات صحيحة</div>
      </div>
      <div class="stat-box">
        <div class="num" id="wrongCount">0</div>
        <div class="label">إجابات خاطئة</div>
      </div>
      <div class="stat-box">
        <div class="num" id="percentScore">0%</div>
        <div class="label">النسبة المئوية</div>
      </div>
    </div>
    
    <div class="start-buttons">
      <button class="btn btn-primary" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
      <button class="btn btn-download" onclick="downloadCode()">⬇️ تحميل الكود</button>
    </div>
  </div>

</div>

</script>
</body>
</html>
